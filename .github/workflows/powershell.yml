# Inline steps comply with organization policy restricting external actions.
name: PSScriptAnalyzer

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '26 5 * * 4'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Run PSScriptAnalyzer and export findings
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -IncludeRule 'PSAvoidGlobalAliases','PSAvoidUsingConvertToSecureStringWithPlainText')
          # Export before failing the step so real findings can still be uploaded.
          $records = @($findings | ForEach-Object {
            @{
              rule = $_.RuleName
              severity = [string]$_.Severity
              message = $_.Message
              path = $_.ScriptPath
              line = [Math]::Max(1, [int]$_.Line)
            }
          })
          ConvertTo-Json -InputObject $records -Depth 10 | Set-Content findings.json -Encoding utf8
          Write-Host "PSScriptAnalyzer found $($findings.Count) issue(s)."
          if ($findings.Count -gt 0) { exit 1 }

      - name: Build SARIF from analyzer findings
        if: ${{ !cancelled() && hashFiles('findings.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd().resolve()
          findings = json.loads(Path("findings.json").read_text(encoding="utf-8-sig"))
          results = []
          for finding in findings:
              location = Path(finding["path"]).resolve().relative_to(root).as_posix()
              # URI-encode spaces and other reserved path characters.
              from urllib.parse import quote
              results.append({
                  "ruleId": finding["rule"],
                  "level": {"Error": "error", "Warning": "warning"}.get(finding["severity"], "note"),
                  "message": {"text": finding["message"]},
                  "locations": [{"physicalLocation": {
                      "artifactLocation": {"uri": quote(location, safe="/")},
                      "region": {"startLine": finding["line"]}
                  }}]
              })
          report = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{
                  "tool": {"driver": {"name": "PSScriptAnalyzer"}},
                  "automationDetails": {"id": "PSScriptAnalyzer/"},
                  "results": results
              }]
          }
          Path("results.sarif").write_text(json.dumps(report), encoding="utf-8")
          PY

      - name: Upload SARIF through GitHub API
        # Fork pull requests lack a writable security-events token.
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          payload = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "sarif": base64.b64encode(gzip.compress(Path("results.sarif").read_bytes())).decode("ascii"),
          }
          request = Request(f"{api}/repos/{repo}/code-scanning/sarifs",
                            data=json.dumps(payload).encode(), headers=headers, method="POST")
          with urlopen(request, timeout=60) as response:
              upload_id = json.load(response)["id"]
          # An accepted upload may still fail validation during processing.
          for attempt in range(30):
              request = Request(f"{api}/repos/{repo}/code-scanning/sarifs/{upload_id}", headers=headers)
              with urlopen(request, timeout=60) as response:
                  status = json.load(response)
              if status["processing_status"] == "complete":
                  print("PSScriptAnalyzer SARIF upload completed.")
                  break
              if status["processing_status"] == "failed":
                  raise RuntimeError("SARIF processing failed; inspect code scanning upload diagnostics.")
              time.sleep(2)
          else:
              raise TimeoutError("SARIF processing did not complete within the polling window.")
          PY
